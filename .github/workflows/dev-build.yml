# Run manually from Actions on the fork's default (master) branch.
# Builds the latest wear-assistant code; never signs with release keys or publishes a release.
name: Wear assistant dev APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out wear-assistant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wear-assistant
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build phone and watch dev APKs
        run: ./gradlew --no-daemon :androidApp:assembleDev :wearApp:assembleDev

      - name: Record source commit
        run: git rev-parse HEAD > build-commit.txt

      - name: Upload APKs (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: herald-wear-assistant-dev
          path: |
            androidApp/build/outputs/apk/dev/*.apk
            wearApp/build/outputs/apk/dev/*.apk
            build-commit.txt
          if-no-files-found: error
          retention-days: 14
